<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Servicios especializados diseñados a la medida." />
    <title>Servicio | Tienda</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="img/Logo/isotipo_Negro.png" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <!-- Bootstrap CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/styles.css?v=5.0" rel="stylesheet" />
    <link href="css/modern-styles.css?v=5.0" rel="stylesheet" />
</head>

<body class="modo-oscuro">
    <!-- Navigation-->
    <div id="navbar"></div>

    <!-- Header Hero del Servicio -->
    <header class="gradient-bg position-relative overflow-hidden py-5" style="min-height: 240px; display: flex; align-items: center;">
        <div class="container px-4 px-lg-5 text-center position-relative" style="z-index: 2;">
            <div class="banner-card mx-auto text-center p-4 rounded-4 shadow-lg w-100" style="max-width:850px;">
                <span id="servicioIconoDisplay" class="display-3 d-block mb-2 text-primary"><i class="bi bi-briefcase"></i></span>
                <h1 class="display-5 fw-bold text-white mb-2" id="servicioTituloHeader">Cargando Servicio...</h1>
                <p class="lead text-white-50 mb-0" id="servicioSubtituloHeader" style="font-size:1.15rem;">Por favor espera mientras obtenemos los detalles.</p>
            </div>
        </div>
    </header>

    <!-- Contenido del Servicio -->
    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-9">
                    <!-- Tarjeta Principal del Servicio -->
                    <div class="card border-0 shadow-sm p-4 p-md-5 mb-5 rounded-4 bg-white text-dark">
                        <!-- Imagen destacada si existe -->
                        <div id="servicioImagenContainer" class="mb-4 text-center d-none">
                            <img id="servicioImagenImg" src="" alt="Servicio" class="img-fluid rounded-4 shadow-sm" style="max-height: 420px; width: 100%; object-fit: cover;">
                        </div>

                        <!-- Texto / Descripción del Servicio -->
                        <div id="servicioContenidoBody" class="fs-5 leading-relaxed mb-4">
                            Cargando información del servicio...
                        </div>

                        <!-- Botón de Acción WhatsApp -->
                        <div class="border-top pt-4 mt-3 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
                            <div>
                                <h6 class="fw-bold mb-1">¿Tienes dudas o quieres contratar este servicio?</h6>
                                <p class="text-muted small mb-0">Contáctanos directamente por WhatsApp para asesoría inmediata.</p>
                            </div>
                            <button id="btnConsultarServicioWA" class="btn btn-success btn-lg rounded-pill px-4 fw-bold d-flex align-items-center gap-2 shadow-sm text-nowrap">
                                <i class="bi bi-whatsapp fs-4"></i> Consultar por WhatsApp
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer-->
    <div id="footer"></div>

    <!-- Firebase y Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/theme-system.js"></script>
    <script src="js/scripts.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const urlParams = new URLSearchParams(window.location.search);
            const servicioId = urlParams.get('id');

            if (!servicioId) {
                mostrarErrorServicio('Servicio no especificado');
                return;
            }

            try {
                const db = firebase.firestore();
                const doc = await db.collection('servicios').doc(servicioId).get();
                if (!doc.exists) {
                    mostrarErrorServicio('El servicio solicitado no existe o fue eliminado');
                    return;
                }

                const s = doc.data();

                // Encabezados
                document.getElementById('servicioTituloHeader').textContent = s.titulo || 'Servicio';
                document.getElementById('servicioSubtituloHeader').textContent = s.subtitulo || '';
                document.title = `${s.titulo} - ${window.configGeneral?.nombreTienda || 'Tienda'}`;

                // Ícono
                const iconoDisplay = document.getElementById('servicioIconoDisplay');
                if (iconoDisplay && s.icono) {
                    iconoDisplay.innerHTML = `<i class="bi ${s.icono}"></i>`;
                }

                // Imagen
                if (s.imagenUrl) {
                    const imgCont = document.getElementById('servicioImagenContainer');
                    const img = document.getElementById('servicioImagenImg');
                    img.src = s.imagenUrl;
                    imgCont.classList.remove('d-none');
                }

                // Contenido HTML / Texto
                const body = document.getElementById('servicioContenidoBody');
                if (s.contenido) {
                    body.innerHTML = s.contenido.replace(/\n/g, '<br>');
                } else if (s.subtitulo) {
                    body.innerHTML = `<p>${s.subtitulo}</p>`;
                } else {
                    body.innerHTML = `<p>Consulta con nuestro equipo para conocer todos los detalles de este servicio.</p>`;
                }

                // WhatsApp Button
                const btnWA = document.getElementById('btnConsultarServicioWA');
                if (btnWA) {
                    btnWA.onclick = function() {
                        const phone = window.phone || window.configGeneral?.telefonoWhatsapp || '51916907657';
                        const msg = `Hola, quisiera más información sobre el servicio: *${s.titulo}*`;
                        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
                    };
                }

            } catch (e) {
                console.error('Error cargando servicio:', e);
                mostrarErrorServicio('Error al cargar la información del servicio');
            }
        });

        function mostrarErrorServicio(msg) {
            document.getElementById('servicioTituloHeader').textContent = 'Servicio no disponible';
            document.getElementById('servicioSubtituloHeader').textContent = msg;
            document.getElementById('servicioContenidoBody').innerHTML = `<div class="alert alert-warning text-center py-4"><h4>${msg}</h4><a href="index.html" class="btn btn-primary rounded-pill mt-3">Ir al Inicio</a></div>`;
        }
    </script>
</body>

</html>
